version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: saiv-trial-postgres
    environment:
      POSTGRES_USER: saiv
      POSTGRES_PASSWORD: saiv_password
      POSTGRES_DB: saiv
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-trial-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  # ==========================================================================
  # Application Services
  # ==========================================================================

  backend:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    container_name: saiv-trial-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-change-in-production
      FACE_SERVICE_URL: http://face-recognition:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  face-recognition:
    build:
      context: ./module3-face-recognition
      dockerfile: Dockerfile
    container_name: saiv-trial-face-recognition
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saiv-network

networks:
  saiv-network:
    driver: bridge

volumes:
  postgres_data:
